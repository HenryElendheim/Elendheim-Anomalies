name: Renumber releases

# A one off maintenance job. The first two releases went out numbered as though the
# app were finished, which it is not, so they are moved onto the pre alpha numbering
# and the old tags are cleared away. Run it by hand, never on a push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renumber:
    runs-on: ubuntu-latest
    steps:
      - name: Move each release onto its new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          move() {
            old="$1"; new="$2"
            if ! gh release view "$old" --repo "$REPO" >/dev/null 2>&1; then
              echo "no release on $old, nothing to move"
              return 0
            fi
            # The new tag is created at exactly the commit the old one pointed at, so
            # the release keeps pointing at the code it was actually built from.
            sha=$(gh api "repos/$REPO/git/ref/tags/$old" --jq '.object.sha')
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/$new" -f sha="$sha" >/dev/null 2>&1 || true
            gh release edit "$old" --repo "$REPO" --tag "$new" --title "Elendheim Anomalies $new"
            echo "moved $old to $new at $sha"
            # The old tag goes only once the release is safely on the new one, so a
            # failure half way through can never lose the release.
            gh api -X DELETE "repos/$REPO/git/refs/tags/$old" >/dev/null 2>&1 || true
          }
          move v1.0 v0.001
          move v1.001 v0.002
          echo "--- releases now ---"
          gh release list --repo "$REPO"
